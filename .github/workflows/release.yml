name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.2.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ inputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        run: |
          if ! echo "${{ inputs.tag }}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag must be in the format v<MAJOR>.<MINOR>.<PATCH>"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: >-
          python -m pip install
          homeassistant
          "pytest-homeassistant-custom-component>=0.13.200"
          "pytest-cov>=6.0"
          "ruff>=0.9.0"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: python -m ruff check custom_components tests

      - name: Run backend tests
        run: python -m pytest -q

      - name: Run frontend checks and tests
        run: |
          npm run check
          npm test
        working-directory: frontend

      - name: Write version into manifest.json and pyproject.toml
        env:
          VERSION: ${{ inputs.tag }}
        run: |
          V="${VERSION#v}"
          python - <<EOF
          import json, pathlib
          p = pathlib.Path("custom_components/scheduled_climate/manifest.json")
          d = json.loads(p.read_text())
          d["version"] = "$V"
          p.write_text(json.dumps(d, indent=2) + "\n")
          EOF
          sed -i "s/^version = \".*\"/version = \"$V\"/" pyproject.toml

      - name: Write version into frontend package.json
        env:
          VERSION: ${{ inputs.tag }}
        run: npm version "${VERSION#v}" --no-git-tag-version
        working-directory: frontend

      - name: Regenerate Python package metadata
        run: python -m pip install --no-deps --editable . -q

      - name: Rebuild frontend bundle
        run: npm run build
        working-directory: frontend

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit version bump
        run: |
          git add \
            custom_components/scheduled_climate/manifest.json \
            pyproject.toml \
            scheduled_climate.egg-info/PKG-INFO \
            frontend/package.json \
            frontend/package-lock.json \
            custom_components/scheduled_climate/frontend/scheduled-climate-card.js
          git commit -m "Release ${{ inputs.tag }}"

      - name: Tag and push
        run: |
          git tag "${{ inputs.tag }}"
          git push origin HEAD "${{ inputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          generate_release_notes: true
