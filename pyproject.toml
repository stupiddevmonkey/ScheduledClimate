[project]
name = "scheduled-climate"
version = "1.1.1"
requires-python = ">=3.13"
dependencies = ["homeassistant>=2026.1.0"]

[project.optional-dependencies]
test = [
  "pytest-homeassistant-custom-component>=0.13.200",
  "pytest-cov>=6.0",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
