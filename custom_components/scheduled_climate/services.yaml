start_on_timer:
  name: Start on timer
  description: Starts or replaces a timer that turns the climate entity on.
  target:
    entity:
      integration: scheduled_climate
      domain: climate
  fields:
    duration:
      name: Duration
      description: Time to wait before turning the climate entity on.
      required: true
      selector:
        duration:

start_off_timer:
  name: Start off timer
  description: Starts or replaces a timer that turns the climate entity off.
  target:
    entity:
      integration: scheduled_climate
      domain: climate
  fields:
    duration:
      name: Duration
      description: Time to wait before turning the climate entity off.
      required: true
      selector:
        duration:

cancel_timer:
  name: Cancel timer
  description: Cancels the active timer for the climate entity.
  target:
    entity:
      integration: scheduled_climate
      domain: climate

link_schedule:
  name: Link schedule
  description: Links a schedule helper to the climate entity, or unlinks it when no schedule is given.
  target:
    entity:
      integration: scheduled_climate
      domain: climate
  fields:
    schedule_id:
      name: Schedule ID
      description: Storage ID of the schedule helper. Leave empty to unlink the current schedule.
      required: false
      selector:
        text:

enable_schedule:
  name: Enable schedule
  description: Resumes applying the linked schedule to the climate entity.
  target:
    entity:
      integration: scheduled_climate
      domain: climate

disable_schedule:
  name: Disable schedule
  description: Pauses the linked schedule without unlinking it. The schedule can be re-enabled later.
  target:
    entity:
      integration: scheduled_climate
      domain: climate
